<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pokémon Card Library</title>
<meta name="description" content="A private Pokémon card collection tracker.">
<meta name="theme-color" content="#eaf0fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#091a48" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Card Library">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Mono:wght@400;500&display=swap">
<!-- Bump ?v= on styles.css and app.js with every release so browsers don't mix an old script with a new page -->
<link rel="stylesheet" href="styles.css?v=20261103c">
</head>
<body>

<div id="gate">
  <h1>Card Library</h1>
  <p class="muted" id="gateMsg">Sign in with Google to open your collection.</p>
  <button class="btn primary" id="signInBtn">Sign in with Google</button>
  <button class="btn" id="gateOutBtn" hidden>Sign out</button>
</div>

<div class="wrap" id="app" hidden>
  <div class="swirl" aria-hidden="true"><svg viewBox="0 0 260 260" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round"><polyline points="138,130 140,131 142,133 145,135 146,137 148,140 149,143 149,146 149,150 149,154 147,157 146,161 143,165 140,169 137,172 133,175 128,177 123,179 118,181 112,182 106,182 99,181 93,180 86,178 80,175 74,171 68,166 62,161 57,155 53,148 49,140 46,132 43,123 42,114 42,105 42,95 44,86 47,76 51,66 56,57 62,48 69,39 77,32 87,25 97,18 108,13 119,9 132,6 144,4 157,4 171,5"/><polyline points="135,136 136,139 136,141 136,144 135,147 133,150 132,153 129,155 126,157 123,159 119,161 115,162 111,162 106,162 102,161 97,160 92,158 87,155 83,152 78,148 74,143 71,138 68,132 66,126 64,119 63,111 63,104 64,96 65,88 68,81 71,73 76,65 81,58 87,52 95,45 102,40 111,35 121,31 131,28 141,26 152,26 163,26 174,28 185,30 197,34 207,40 218,46 228,54 237,63 245,73 253,84"/><polyline points="128,138 127,140 125,142 122,143 120,144 117,145 113,145 110,145 106,144 103,143 99,141 96,138 93,135 90,132 88,127 86,123 84,118 83,112 83,107 84,101 85,95 87,89 90,83 93,77 98,71 103,66 108,61 115,57 122,53 130,51 138,48 147,47 156,47 165,48 174,49 183,52 192,56 201,61 210,67 218,74 225,82 232,91 238,101 242,111 246,122 249,134 250,147 250,159 249,172 247,185 243,197"/><polyline points="123,133 120,134 118,133 115,132 112,131 110,129 108,127 106,124 104,120 103,117 102,113 102,109 103,104 104,100 106,95 108,91 111,87 115,83 119,79 124,76 129,73 135,71 142,69 149,68 156,68 163,69 170,70 178,73 185,76 192,80 199,85 205,91 211,98 216,106 220,114 224,123 227,133 228,143 229,153 229,164 227,175 224,185 220,196 215,206 208,216 201,226 192,234 182,242 172,249 160,255 148,260"/><polyline points="123,127 121,125 120,122 119,120 118,117 118,114 119,110 120,107 121,104 124,101 126,98 129,95 133,93 137,91 142,89 147,88 152,88 158,89 163,90 169,91 174,94 180,97 185,101 190,106 194,111 198,118 202,124 204,132 206,139 207,148 208,156 207,165 205,173 202,182 199,191 194,199 188,207 181,215 174,222 165,228 156,233 145,238 135,241 123,244 111,245 99,245 87,244 75,241 63,237 51,232 39,225"/><polyline points="128,122 129,120 130,117 131,115 133,113 136,111 138,109 142,108 145,107 149,107 153,107 157,108 161,109 165,111 169,114 173,117 176,121 180,126 182,131 184,136 186,142 187,149 187,155 186,162 185,169 182,176 179,183 175,189 170,196 165,202 158,207 151,212 143,216 134,219 125,222 116,223 106,224 96,223 85,221 75,219 65,215 55,209 46,203 37,196 29,187 21,178 14,167 9,156 4,144 1,131 -1,118"/><polyline points="135,124 137,123 140,122 143,121 146,122 149,122 152,123 155,125 157,127 160,130 162,133 164,137 166,141 167,146 167,151 167,156 166,161 164,166 162,171 159,176 155,181 151,186 146,190 140,194 134,197 127,199 120,201 112,202 104,202 96,202 87,200 79,197 71,194 63,189 55,183 48,177 42,169 36,161 31,152 27,142 23,132 21,121 20,110 21,98 22,86 25,75 29,63 34,52 41,41 49,30 58,20"/></svg></div>
  <header>
    <h1>Card Library</h1>
    <div class="tally" id="tally"></div>
  </header>
  <div id="banner" role="status" hidden></div>
  <nav aria-label="Views">
    <button class="tab" id="tab-library" data-view="library">Library</button>
    <button class="tab" id="tab-sets" data-view="sets">Sets</button>
    <button class="tab" id="tab-checklist" data-view="checklist">Checklists</button>
    <button class="tab" id="tab-places" data-view="places">Boxes &amp; decks</button>
    <button class="tab" id="tab-trade" data-view="trade">Trade pile</button>
    <button class="tab" id="tab-activity" data-view="activity">Activity</button>
    <div class="actions">
      <button class="btn primary" id="addBtn" data-write>Add card</button>
      <button class="btn" id="importBtn" data-write>Import TCGplayer CSV</button>
      <button class="btn" id="pricesBtn" data-write>Update prices</button>
      <input id="importFile" type="file" accept=".csv,text/csv" hidden>
      <input id="restoreFile" type="file" accept=".json,application/json" hidden>
    </div>
  </nav>

  <section id="view-library" hidden>
    <div class="filters" style="margin-bottom:10px">
      <label class="field search"><span>Search</span><input id="f-q" type="search" placeholder="Card name, number or note"></label>
      <label class="field"><span>Type</span><select id="f-type"></select></label>
      <label class="field"><span>Energy</span><select id="f-energy"></select></label>
      <label class="field"><span>Set</span><select id="f-set"></select></label>
      <label class="field"><span>Location</span><select id="f-loc"></select></label>
      <label class="field"><span>Show</span><select id="f-check">
        <option value="">Everything</option><option value="special">Stamped or patterned</option><option value="review">Needs attention</option>
        <option value="noset">No set recorded</option><option value="priced">Has a price</option></select></label>
    </div>
    <div class="resultbar" style="margin-bottom:8px">
      <span class="muted small" id="resultCount"></span>
      <span style="display:flex;gap:8px;align-items:center">
        <button class="btn" id="clearFilters" hidden>Clear filters</button>
        <label class="field" style="grid-auto-flow:column;align-items:center;gap:6px"><span>Sort</span><select id="f-sort">
          <option value="name">Name</option><option value="type">Card type</option><option value="set">Set and number</option><option value="count">Most copies</option><option value="rarity">Rarest first</option><option value="price">Highest value</option></select></label>
      </span>
    </div>
    <p class="note small" id="attnNote" hidden>These cards are missing details or have a number that does not fit their set. Open one and use <b>Look up this card</b> to fill in its set, number, rarity and picture.</p>
    <div class="ledger" id="ledger"></div>
    <div style="margin-top:10px;text-align:center"><button class="btn" id="more" hidden>Show more</button></div>
  </section>

  <section id="view-sets" hidden><div class="sets" id="sets"></div></section>
  <section id="view-checklist" hidden><div id="checklist" style="display:grid;gap:10px"></div></section>
  <section id="view-places" hidden><div id="places" style="display:grid;gap:12px"></div></section>
  <section id="view-trade" hidden><div id="trade" style="display:grid;gap:10px"></div></section>
  <section id="view-activity" hidden><div id="activity" style="display:grid;gap:10px"></div></section>
  <footer class="foot">
    <span class="muted small" id="who"></span>
    <button class="btn" id="exportBtn">Export CSV</button>
    <button class="btn" id="backupBtn">Download backup</button>
    <button class="btn" id="signOutBtn">Sign out</button>
  </footer>
</div>

<dialog id="editor"><form class="dlg" id="editForm" method="dialog">
  <h2 id="editTitle">Add card</h2>
  <details class="lookup" id="lookup">
    <summary id="lookupSum">Find the card</summary>
    <div class="lookrow">
      <label class="field"><span>Card name</span><input id="l-q" type="search" placeholder="e.g. Charizard ex" autocomplete="off" enterkeyhint="search"></label>
      <label class="field"><span>Set</span><select id="l-set"><option value="">Any set</option></select></label>
      <button class="btn" type="button" id="l-go">Search</button>
    </div>
    <p class="small muted" id="l-msg" hidden></p>
    <div class="picks" id="l-results"></div>
  </details>
  <p class="small note" id="lookupDone" hidden></p>
  <img id="e-img" class="bigcard" alt="" hidden>
  <div class="grid2">
    <label class="field full"><span>Card name</span><input id="e-name" list="nameList" required autocomplete="off"></label>
    <label class="field"><span>Card type</span><select id="e-type"></select></label>
    <label class="field"><span>Detailed type</span><select id="e-detail"></select></label>
    <label class="field"><span>Energy type</span><select id="e-energy"></select></label>
    <label class="field"><span>Count</span><input id="e-count" type="number" min="1" step="1" inputmode="numeric" required></label>
    <label class="field"><span>Set abbreviation</span><input id="e-set" list="setList" autocomplete="off"></label>
    <label class="field"><span>Card number</span><input id="e-num" placeholder="086/217" autocomplete="off"></label>
    <label class="field"><span>Rarity</span><select id="e-rarity"></select></label>
    <label class="field"><span>Printing</span><select id="e-print"></select></label>
    <label class="field"><span>Pattern</span><select id="e-pattern"></select></label>
    <label class="field"><span>Stamp</span><select id="e-stamp"></select></label>
    <label class="field"><span>Location</span><input id="e-loc" list="locList" required pattern=".*\S.*" title="Choose where this card is kept" autocomplete="off"></label>
    <label class="field"><span>Deck</span><input id="e-deck" list="deckList" autocomplete="off"></label>
    <label class="field"><span>TCG market price ($)</span><input id="e-price" type="number" min="0" step="0.01" inputmode="decimal"></label>
    <label class="field"><span>Notes</span><input id="e-notes" autocomplete="off"></label>
  </div>
  <div class="move" id="moveBox" hidden>
    <label class="field"><span>Move copies</span><input id="m-count" type="number" min="1" step="1"></label>
    <label class="field"><span>To location</span><input id="m-loc" list="locList" autocomplete="off"></label>
    <label class="field"><span>Deck</span><input id="m-deck" list="deckList" autocomplete="off"></label>
    <button class="btn" type="button" id="moveBtn">Move</button>
  </div>
  <div class="dlgfoot">
    <button class="btn danger left" type="button" id="delBtn" hidden>Delete</button>
    <button class="btn" type="button" id="cancelBtn">Cancel</button>
    <button class="btn primary" type="submit" id="saveBtn">Save</button>
  </div>
</form></dialog>

<dialog id="importer"><div class="dlg">
  <h2>Import from TCGplayer</h2>
  <p class="small" id="impSummary" style="margin:0"></p>
  <div class="scrollbox" id="impList"></div>
  <label class="field"><span>Put new cards in</span><input id="impLoc" list="locList" autocomplete="off"></label>
  <div class="dlgfoot">
    <button class="btn" type="button" id="impCancel">Cancel</button>
    <button class="btn" type="button" id="impPrices">Update prices only</button>
    <button class="btn primary" type="button" id="impAdd">Add to library</button>
  </div>
</div></dialog>

<datalist id="nameList"></datalist><datalist id="setList"></datalist><datalist id="locList"></datalist><datalist id="deckList"></datalist>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="app.js?v=20261103c"></script>
</body>
</html>
